name: "read_counts"
description: Per-sample read counts after each step (QC, host removal, alignment to each profiling database), parsed from the logs of the tools
keywords:
  - read counts
  - qc
  - metagenomics
tools:
  - "pandas":
      description: "Python data analysis library"
      homepage: "https://pandas.pydata.org"
      licence: ["BSD-3-Clause"]
      identifier: ""
input:
  - files:
      type: file
      description: |
        The logs and reports of the tools, named uniquely, as in the manifest, staged in inputs/
      pattern: "*.{json,log}"
      ontologies: []
  - manifest:
      type: file
      description: |
        Tab-separated, with a header, one row per input file, with the columns file (its name), sample,
        run_accession, kind, db_name and annot_db_name, where kind is one of fastp, bowtie2, bbmap_repair, motus4, motus3, cayman, gqlib,
        cutadapt_primers, cutadapt_readthrough, vsearch, fastp_merge and idtaxa
      pattern: "*.tsv"
      ontologies: []
output:
  tsv:
    - read_counts.tsv:
        type: file
        description: Read counts, one row per sample
        pattern: "read_counts.tsv"
        ontologies: []
  mqc:
    - read_counts_mqc.tsv:
        type: file
        description: The same table, with the header for MultiQC custom content
        pattern: "read_counts_mqc.tsv"
        ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@saulpierotti"
maintainers:
  - "@saulpierotti"
