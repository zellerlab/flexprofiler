name: "read_counts"
description: Per-sample read counts after each step (QC, host removal, alignment to each profiling database), parsed from the logs of the tools
keywords:
  - read counts
  - qc
  - metagenomics
tools:
  - "python":
      description: "Python, standard library only"
      homepage: "https://www.python.org"
      licence: ["PSF-2.0"]
      identifier: ""
input:
  - files:
      type: file
      description: |
        fastp json reports, bowtie2 logs, and motus4, motus3, cayman and gqlib logs, each staged in its own folder
        inputs/<index>/
      pattern: "*.{json,log}"
      ontologies: []
  - manifest:
      type: file
      description: |
        Tab-separated, without header, one row per input file: <index> <sample> <kind> <db_name> <annot_db_name>,
        where kind is one of fastp, bowtie2, motus4, motus3, cayman, gqlib
      pattern: "*.tsv"
      ontologies: []
output:
  tsv:
    - read_counts.tsv:
        type: file
        description: Read counts, one row per sample
        pattern: "read_counts.tsv"
        ontologies: []
  mqc:
    - read_counts_mqc.tsv:
        type: file
        description: The same table, with the header for MultiQC custom content
        pattern: "read_counts_mqc.tsv"
        ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@saulpierotti"
maintainers:
  - "@saulpierotti"
