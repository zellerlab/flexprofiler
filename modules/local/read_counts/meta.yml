name: "read_counts"
description: Per-sample read counts after each step (QC, host removal, alignment to each profiling database), parsed from the logs of the tools
keywords:
  - read counts
  - qc
  - metagenomics
tools:
  - "python":
      description: "Python, standard library only"
      homepage: "https://www.python.org"
      licence: ["PSF-2.0"]
      identifier: ""
input:
  - - labels:
        type: list
        description: |
          The labels of each file, in the order of the files: maps with the keys sample, run, kind, db_name and
          annot_db_name, where kind is one of fastp, bowtie2, bbmap_repair, motus4, motus3, cayman, gqlib,
          cutadapt_primers, cutadapt_readthrough, vsearch, fastp_merge and idtaxa
    - files:
        type: file
        description: |
          The logs and reports of the tools, each staged in its own folder inputs/<index>/
        pattern: "*.{json,log}"
        ontologies: []
output:
  tsv:
    - read_counts.tsv:
        type: file
        description: Read counts, one row per sample
        pattern: "read_counts.tsv"
        ontologies: []
  mqc:
    - read_counts_mqc.tsv:
        type: file
        description: The same table, with the header for MultiQC custom content
        pattern: "read_counts_mqc.tsv"
        ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@saulpierotti"
maintainers:
  - "@saulpierotti"
