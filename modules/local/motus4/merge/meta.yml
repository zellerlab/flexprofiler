name: "motus4_merge"
description: Taxonomic meta-omics profiling using universal marker genes
keywords:
  - classify
  - metagenomics
  - fastq
  - taxonomic profiling
  - merging
  - merge
  - otu table
tools:
  - "motus4":
      description: "Marker gene-based OTU (mOTU) profiling"
      homepage: "https://motu-tool.org/"
      documentation: "https://github.com/motu-tool/mOTUs/wiki"
      tool_dev_url: "https://github.com/motu-tool/mOTUs"
      doi: "10.1186/s40168-022-01410-z"
      licence: ["GPL v3"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - input:
        type: file
        description: |
          List of output files (more than one) from motus4 profile,
          or a single directory containing motus4 output files.
        ontologies: []
  - db:
      type: directory
      description: |
        mOTUs database downloaded by `motus4 downloadGMDB`
        pattern: "db_mOTU/"
output:
  txt:
    - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
      - "*.txt":
          type: file
          description: OTU table in txt format
          pattern: "*.txt"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@saulpierotti"
maintainers:
  - "@saulpierotti"
