reports:
  multiqc_report.html:
    display: "MultiQC HTML report"
  "**/read_counts/read_counts.tsv":
    display: "The read counts of each sample after each step of the pipeline."
  "**/fastqc/raw/*.html":
    display: "A FastQC report containing quality metrics of raw reads in HTML format."
  "**/fastqc/processed/*.html":
    display: "A FastQC report containing quality metrics of the reads given to the profilers in HTML format."
  "**/falco/raw/*.html":
    display: "A Falco report containing quality metrics of raw reads in HTML format."
  "**/falco/processed/*.html":
    display: "A Falco report containing quality metrics of the reads given to the profilers in HTML format."
  "**/fastp/*.html":
    display: "Results in HTML format."
  "**/fastp/*.log":
    display: "A fastp log file."
  "**/samtools/stats/*stats":
    display: "File containing samtools stats output."
  "**/kraken2/*.tsv":
    display: "The Kraken2 profiles of all samples aligned to a given database."
  "**/kraken2/*/*.report.txt":
    display: "A Kraken2 report that summarises the fraction abundance, taxonomic ID, number of Kmers, taxonomic path of all the hits in the Kraken2 run for a given sample."
  "**/motus4/merge/*.txt":
    display: "A combined profile of all samples aligned to a given database (as generated by motus4 merge)."
  "**/motus4/profile/*/*.log":
    display: "Standard error logging file containing summary statistics."
  "**/motus4/profile/*/*.out":
    display: "Results with taxonomic classification of each read."
  "**/motus3/merge/*.txt":
    display: "A combined profile of all samples aligned to a given database (as generated by motus merge)."
  "**/idtaxa/merge/*/*.tsv":
    display: "The IDTAXA profiles of all samples classified with a given database."
  "**/cayman/merge/*/*/*.txt.gz":
    display: "The Cayman profiles of all samples."
  "**/gqlib/merge/*/*/*.txt.gz":
    display: "The gqlib profiles of all samples."
