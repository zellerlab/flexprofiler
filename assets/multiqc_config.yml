report_comment: >
  This report has been generated by the <a href="https://github.com/zellerlab/flexprofiler" target="_blank">zellerlab/flexprofiler</a>
  analysis pipeline.
report_section_order:
  "zellerlab-flexprofiler-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "zellerlab-flexprofiler-summary":
    order: -1002
  general_stats":
    order: 1000
  read_counts:
    order: 950
  fastqc:
    order: 900
  fastqc-1:
    order: 800
  fastp:
    order: 750
  bowtie2:
    order: 200
  samtools:
    order: 100
  kraken:
    order: 90
  motus4:
    order: 20

export_plots: true

disable_version_detection: true
custom_logo: "zellerlab-flexprofiler_logo_generic.png"
custom_logo_url: https://github.com/zellerlab/flexprofiler
custom_logo_title: "zellerlab/flexprofiler"

run_modules:
  - fastqc
  - fastp
  - bowtie2
  - samtools
  - star
  - kraken
  - motus
  - custom_content

sp:
  fastqc/data:
    fn_re: ".*(fastqc|falco)_data.txt$"
  fastqc/zip:
    fn: "*_fastqc.zip"

top_modules:
  - "fastqc":
      name: "FastQC / Falco (pre-Trimming)"
      # reports named <sample>_<run>[_singletons]_<stage>[_1|_2]_fastqc... (conf/modules.config)
      path_filters:
        - "*_raw_fastqc.zip"
        - "*_raw_[12]_fastqc.zip"
        - "*_raw_fastqc_data.txt"
        - "*_raw_[12]_fastqc_data.txt"
      extra: |
        If used in this run, Falco is a drop-in replacement for FastQC producing
        the same output, written by Guilherme de Sena Brandine and Andrew D. Smith.
  - "fastqc":
      name: "FastQC / Falco (post-Trimming)"
      path_filters:
        - "*_processed_fastqc.zip"
        - "*_processed_[12]_fastqc.zip"
        - "*_processed_fastqc_data.txt"
        - "*_processed_[12]_fastqc_data.txt"
      extra: |
        If used in this run, Falco is a drop-in replacement for FastQC producing
        the same output, written by Guilherme de Sena Brandine and Andrew D. Smith.
  - "bowtie2":
      name: "bowtie2"
  - "samtools":
      name: "Samtools Stats"
  - "star":
      name: "STAR"
      path_filters:
        # STAR_GRCH38 (--pathseq_t2t_grch38_aligner star): <sample>.grch38.Log.final.out, and the reads per gene,
        # <sample>.grch38.ReadsPerGene.out.tab
        - "*.Log.final.out"
        - "*.ReadsPerGene.out.tab"
  - "kraken":
      name: "Kraken"
      path_filters:
        # KRAKEN2_KRAKEN2: <sample>_<db_name>[_singletons].kraken2.report.txt
        - "*.kraken2.report.txt"

# It is not possible to set placement for custom kraken columns.

table_columns_placement:
  FastQC / Falco (pre-Trimming):
    total_sequences: 100
    avg_sequence_length: 110
    median_sequence_length: 120
    percent_duplicates: 130
    percent_gc: 140
    percent_fails: 150
  FastQC / Falco (post-Trimming):
    total_sequences: 200
    avg_sequence_length: 210
    median_sequence_length: 220
    percent_duplicates: 230
    percent_gc: 240
    percent_fails: 250
  fastp:
    pct_adapter: 300
    pct_surviving: 310
    pct_duplication: 320
    after_filtering_gc_content: 330
    after_filtering_q30_rate: 340
    after_filtering_q30_bases: 350
    filtering_result_passed_filter_reads: 360
  bowtie2:
    overall_alignment_rate: 1000
  Samtools Stats:
    raw_total_sequences: 1100
    reads_mapped: 1110
    reads_mapped_percent: 1120
    reads_properly_paired_percent: 1130
    non-primary_alignments: 1140
    reads_MQ0_percent: 1150
    error_rate: 1160
  Kraken:
    "% Unclassified": 1600
    "% Top 5": 1610
  motus4:
    Total number of reads: 1800
    Number of reads after filtering: 1810
    Total number of inserts: 1820
    Unique mappers: 1830
    Multiple mappers: 1840
    Ignored multiple mapper without unique hit: 1850
    "Number of ref-mOTUs": 1860
    "Number of meta-mOTUs": 1870
    "Number of ext-mOTUs": 1880
table_columns_visible:
  FastQC / Falco (pre-Trimming):
    total_sequences: true
    avg_sequence_length: true
    percent_duplicates: true
    percent_gc: true
    percent_fails: false
  FastQC / Falco (post-Trimming):
    total_sequences: true
    avg_sequence_length: true
    percent_duplicates: false
    percent_gc: false
    percent_fails: false
  fastp:
    pct_adapter: true
    pct_surviving: true
    pct_duplication: false
    after_filtering_gc_content: false
    after_filtering_q30_rate: false
    after_filtering_q30_bases: false
  bowtie2:
    overall_alignment_rate: true
  Samtools Stats:
    raw_total_sequences: true
    reads_mapped: true
    reads_mapped_percent: true
    reads_properly_paired_percent: false
    non-primary_alignments: false
    reads_MQ0_percent: false
    error_rate: false
  Kraken: false
  motus4: false

table_columns_name:
  FastQC / Falco (pre-Trimming):
    total_sequences: "Nr. Input Reads"
    avg_sequence_length: "Length Input Reads"
    percent_gc: "% GC Input Reads"
    percent_duplicates: "% Dups Input Reads"
    percent_fails: "% Failed Input Reads"
  FastQC / Falco (post-Trimming):
    total_sequences: "Nr. Processed Reads"
    avg_sequence_length: "Length Processed Reads"
    percent_gc: "% GC Processed Reads"
    percent_duplicates: "% Dups Processed Reads"
    percent_fails: "% Failed Processed Reads"
  Samtools Stats:
    raw_total_sequences: "Nr. Reads Into Mapping"
    reads_mapped: "Nr. Mapped Reads"
    reads_mapped_percent: "% Mapped Reads"

extra_fn_clean_exts:
  - "kraken2.report.txt"
  - ".txt"
  - ".settings"
  - ".bbduk"
  - ".unmapped"
  - "_filtered"
  # the stage of the FastQC/Falco reports, which are split by stage into two sections; the mates (_1/_2) are kept.
  # These rules run before the default ones, so the name still ends in its extension (.gz, .fastq.gz)
  - type: regex
    pattern: "_(raw|processed)(?=(_[12])?\\.)"
    module:
      - fastqc
      - fastqc-1

section_comments:
  general_stats: |
    By default, all read count columns are displayed as millions (M) of reads.
